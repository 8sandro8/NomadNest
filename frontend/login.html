<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NomadNest - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Sora:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <i class="fa-solid fa-shield-halved login-header-icon"></i>
            <h1>NomadNest</h1>
            <p>Iniciar sesión para gestionar alojamientos</p>
        </div>
        
        <div id="error" class="error-message"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username" class="form-group-label">Usuario</label>
                <input type="text" id="username" name="username" required minlength="3" autocomplete="username" class="form-group-input">
            </div>
            
            <div class="form-group">
                <label for="password" class="form-group-label">Contraseña</label>
                <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password" class="form-group-input">
            </div>
            
            <button type="submit" class="btn-login" id="btn-submit">Iniciar Sesión</button>
        </form>
        
        <div class="register-link">
            <p>¿No tienes cuenta? <a href="register.html">Registrarse</a></p>
        </div>

        <div class="back-link">
            <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>
        </div>
    </div>

    <!-- Cargar auth.js primero -->
    <script src="js/auth.js"></script>
    <script>
        // Verificar si ya está logueado - redirigir a admin
        if (Auth.isLoggedIn()) {
            window.location.href = 'admin.html';
        }

        // Manejo del formulario de login
        const loginForm = document.getElementById('login-form');
        const errorDiv = document.getElementById('error');
        const btnSubmit = document.getElementById('btn-submit');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Limpiar errores previos
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';
            
            // Deshabilitar botón durante login
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Iniciando sesión...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const result = await Auth.login(username, password);

                if (result.success) {
                    // Login exitoso - redirigir a admin
                    window.location.href = 'admin.html';
                } else {
                    // Mostrar error
                    errorDiv.textContent = result.error || 'Credenciales inválidas';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Error de conexión. Intenta de nuevo.';
                errorDiv.classList.add('show');
            } finally {
                // Reactivar botón
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
