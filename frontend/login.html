<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NomadNest - Iniciar Sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            color: #1a472a;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: #666;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1a472a;
        }
        .btn-login {
            width: 100%;
            padding: 0.875rem;
            background: #1a472a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover {
            background: #2d5a3f;
        }
        .btn-login:disabled {
            background: #999;
            cursor: not-allowed;
        }
        .error-message {
            background: #fee;
            color: #c33;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .back-link a {
            color: #1a472a;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 NomadNest</h1>
            <p>Iniciar sesión para gestionar alojamientos</p>
        </div>
        
        <div id="error" class="error-message"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required minlength="3" autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn-login" id="btn-submit">Iniciar Sesión</button>
        </form>
        
        <div class="back-link">
            <a href="index.html">← Volver al inicio</a>
        </div>
    </div>

    <!-- Cargar auth.js primero -->
    <script src="js/auth.js"></script>
    <script>
        // Verificar si ya está logueado - redirigir a admin
        if (Auth.isLoggedIn()) {
            window.location.href = 'admin.html';
        }

        // Manejo del formulario de login
        const loginForm = document.getElementById('login-form');
        const errorDiv = document.getElementById('error');
        const btnSubmit = document.getElementById('btn-submit');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Limpiar errores previos
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';
            
            // Deshabilitar botón durante login
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Iniciando sesión...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const result = await Auth.login(username, password);

                if (result.success) {
                    // Login exitoso - redirigir a admin
                    window.location.href = 'admin.html';
                } else {
                    // Mostrar error
                    errorDiv.textContent = result.error || 'Credenciales inválidas';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Error de conexión. Intenta de nuevo.';
                errorDiv.classList.add('show');
            } finally {
                // Reactivar botón
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
