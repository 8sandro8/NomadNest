<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles | NomadNest</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Sora:wght@600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body style="background-color: var(--color-bg);">

    <header class="main-header">
        <div class="logo">NomadNest 🌲</div>
        <nav>
            <ul>
                <li><a href="index.html">⬅ Volver al Inicio</a></li>
            </ul>
        </nav>
    </header>

    <main style="max-width: 900px; margin: 4rem auto; padding: 0 2rem;">

        <div id="detail-container" class="detail-card">
            <img id="detail-img" src="" alt="Cabaña" class="detail-image">

            <div class="detail-content">
                <div class="detail-header">
                    <h1 id="detail-title" class="detail-title">Cargando...</h1>
                    <span id="detail-price" class="detail-price">0€</span>
                </div>

                <div class="detail-badge">
                    <span id="detail-wifi">⚡ Cargando WiFi...</span>
                </div>

                <h3 class="detail-subtitle">Descripción</h3>
                <p id="detail-desc" class="detail-description">
                    Cargando información detallada...
                </p>

                <div class="detail-actions">
                    <button class="btn-primary" onclick="alert('Funcionalidad de Reserva próximamente 📅')">Reservar
                        Ahora</button>
                </div>
            </div>
        </div>

        <div id="comments-section" class="comments-section">
            <h2 data-translate="comments_title" class="section-title">💬 Opiniones de la Comunidad</h2>

            <div id="comments-list" class="comments-list">
                <p class="text-muted">Cargando opiniones...</p>
            </div>

            <hr class="divider">

            <h3 data-translate="leave_comment" class="comment-form-title">Deja tu opinión</h3>
            <form id="form-comentario" class="comment-form">
                <input type="text" id="comentario-usuario" placeholder="Tu nombre" required class="form-input">
                <textarea id="comentario-texto" placeholder="¿Qué te pareció el internet y la cabaña?" required
                    class="form-input form-textarea"></textarea>
                <button type="submit" class="btn-secondary" data-translate="send_comment">Publicar Comentario</button>
            </form>
        </div>

    </main>

    <footer style="background: var(--color-accent); color: white; text-align: center; padding: 1rem; margin-top: 4rem;">
        <p>© 2025 NomadNest</p>
    </footer>

    <script src="js/app.js?v=comments_v1"></script>
</body>

</html>
