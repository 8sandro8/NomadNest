<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <!-- Gradiente para la montaña -->
    <linearGradient id="mountainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5A3D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A3D28;stop-opacity:1" />
    </linearGradient>
    <!-- Gradiente para el techo -->
    <linearGradient id="roofGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5A2B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D3A1A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Montaña grande (fondo) -->
  <path d="M20 70 L70 15 L120 70 Z" fill="url(#mountainGradient)" />
  
  <!-- Montaña pequeña (izquierda) -->
  <path d="M5 70 L40 35 L75 70 Z" fill="#3D7A4F" />
  
  <!-- Montaña mediana (derecha) -->
  <path d="M90 70 L135 25 L180 70 Z" fill="#2D5A3D" />
  
  <!-- Cabaña/Refugio -->
  <rect x="55" y="45" width="50" height="30" fill="#D4A574" rx="3" />
  
  <!-- Techo de la cabaña -->
  <path d="M50 45 L80 25 L110 45 Z" fill="url(#roofGradient)" />
  
  <!-- Chimenea -->
  <rect x="95" y="28" width="8" height="12" fill="#5D3A1A" rx="1" />
  <rect x="93" y="26" width="12" height="5" fill="#8B5A2B" rx="1" />
  
  <!-- Ventana -->
  <rect x="70" y="52" width="12" height="12" fill="#87CEEB" rx="2" stroke="#5D3A1A" stroke-width="1.5" />
  <line x1="76" y1="52" x2="76" y2="64" stroke="#5D3A1A" stroke-width="1.5" />
  <line x1="70" y1="58" x2="82" y2="58" stroke="#5D3A1A" stroke-width="1.5" />
  
  <!-- Puerta -->
  <rect x="85" y="52" width="12" height="18" fill="#5D3A1A" rx="2" />
  <circle cx="94" cy="61" r="1.5" fill="#D4A574" />
</svg>